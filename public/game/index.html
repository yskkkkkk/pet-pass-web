<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>미니게임</title>
  <meta name="description" content="PC 화면에 띄워 여럿이 함께 하거나, 혼자 가볍게 즐기는 작은 게임 모음.">
  <meta name="theme-color" content="#F5F2EA">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/game/shared/game.css">
</head>
<body>
  <main class="hub">
    <header class="hub-head">
      <h1>미니게임</h1>
      <p class="lead">PC 화면에 띄워 여럿이 함께 하거나, 혼자 가볍게 즐기는 작은 게임 모음입니다.</p>
    </header>

    <section class="hub-join" aria-labelledby="join-title">
      <h2 id="join-title">참가 코드가 있나요?</h2>
      <form id="join-form" class="hub-join-form" autocomplete="off">
        <label class="sr-only" for="join-code">진행 화면에 보이는 4자리 코드</label>
        <input class="input input-code" id="join-code" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="0000" required>
        <button class="btn btn-primary btn-lg" type="submit">참가하기</button>
      </form>
      <p class="muted hub-join-hint">진행 화면의 QR 코드를 휴대폰 카메라로 찍어도 바로 들어갈 수 있어요.</p>
    </section>

    <section class="hub-section" data-type="party" hidden>
      <div class="hub-section-head">
        <h2>같이 하는 게임</h2>
        <p class="muted">PC나 TV에 진행 화면을 띄우고, 각자 휴대폰으로 참가합니다.</p>
      </div>
      <ul class="game-list"></ul>
    </section>

    <section class="hub-section" data-type="solo" hidden>
      <div class="hub-section-head">
        <h2>혼자 하는 게임</h2>
        <p class="muted">휴대폰이나 PC에서 바로 시작합니다.</p>
      </div>
      <ul class="game-list"></ul>
    </section>
  </main>

  <script src="/game/games.js"></script>
  <script src="/game/shared/logic.js"></script>
  <script src="/game/shared/common.js"></script>
  <script>
    (function () {
      var esc = MG.escapeHtml;

      // 게임 목록(games.js)으로 종류별 칸을 채운다. 게임이 없는 칸은 숨긴 채로 둔다.
      var sections = document.querySelectorAll('.hub-section');
      for (var i = 0; i < sections.length; i++) {
        var type = sections[i].getAttribute('data-type');
        var games = window.MG_GAMES.filter(function (g) { return g.type === type; });
        if (games.length === 0) continue;
        sections[i].querySelector('.game-list').innerHTML = games.map(function (g) {
          return '<li><a class="game-item" href="' + esc(g.path) + '">' +
            '<span class="game-name">' + esc(g.name) + '</span>' +
            '<span class="game-tagline">' + esc(g.tagline) + '</span>' +
            (g.players ? '<span class="game-meta">' + esc(g.players) + '</span>' : '') +
            '<span class="game-arrow" aria-hidden="true">→</span>' +
          '</a></li>';
        }).join('');
        sections[i].hidden = false;
      }

      var codeInput = document.getElementById('join-code');
      codeInput.addEventListener('input', function () {
        codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 4);
      });
      document.getElementById('join-form').addEventListener('submit', function (e) {
        e.preventDefault();
        if (!/^\d{4}$/.test(codeInput.value)) return codeInput.focus();
        location.href = '/game/play?room=' + codeInput.value;
      });

      // 참가 입구(/game/play)에서 방을 못 찾아 되돌아온 경우. 문구는 여기서 정한 것만 쓴다.
      var ERRORS = {
        notfound: '방을 찾을 수 없어요. 코드를 확인해 주세요.',
        failed: '방 정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'
      };
      var params = new URLSearchParams(location.search);
      if (params.get('code')) codeInput.value = params.get('code').replace(/\D/g, '').slice(0, 4);
      if (ERRORS[params.get('error')]) MG.toast(ERRORS[params.get('error')]);
    })();
  </script>
</body>
</html>
