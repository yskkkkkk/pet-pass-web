<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>미니게임 · 참가</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F5F2EA">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/game/shared/game.css">
</head>
<body>
  <!--
    모든 같이 하는 게임의 참가 입구. QR 코드와 허브의 "참가하기"가 이 주소로 온다.
    방이 어떤 게임인지 확인한 뒤 그 게임의 참가 화면(<게임 경로>/play)으로 보낸다.
  -->
  <main class="landing">
    <p class="muted">참가 화면으로 이동하는 중…</p>
  </main>

  <script src="/game/shared/common.js"></script>
  <script>
    (function () {
      var code = (new URLSearchParams(location.search).get('room') || '').replace(/\D/g, '').slice(0, 4);
      if (code.length !== 4) return location.replace('/game');

      MG.get({ action: 'info', code: code })
        .then(function (info) {
          location.replace(info.path + '/play?room=' + code);
        })
        .catch(function (err) {
          location.replace('/game?code=' + code + '&error=' + (err.status === 404 ? 'notfound' : 'failed'));
        });
    })();
  </script>
</body>
</html>
