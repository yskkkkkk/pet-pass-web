<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니게임 · 진행자</title>
  <meta name="robots" content="noindex">
  <!-- 예전 주소(/game/host?room=…) 호환: 그때는 소수결 게임만 있었으므로 소수결 진행 화면으로 보낸다. -->
  <script>location.replace('/game/minority/host' + location.search + location.hash);</script>
</head>
<body>
  <p><a href="/game/minority">소수결 게임으로 이동</a></p>
</body>
</html>
