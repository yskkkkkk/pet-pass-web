<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소수결 게임 · 진행자</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#12142A">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/game/game.css">
</head>
<body>
  <div class="host">
    <header class="host-header">
      <a class="brand" href="/game"><span class="brand-mark" aria-hidden="true"><span></span><span></span></span>소수결 게임</a>
      <div class="meta">
        <span class="pill" id="h-round" hidden></span>
        <span class="pill" id="h-alive" hidden></span>
        <span class="pill room-badge" id="h-room" hidden></span>
      </div>
    </header>

    <main class="host-main" id="host-main">
      <div class="notice-screen" id="h-loading">
        <p class="dots">불러오는 중</p>
      </div>
    </main>
  </div>

  <script src="/game/vendor/qrcode.js"></script>
  <script src="/game/common.js"></script>
  <script src="/game/host.js"></script>
</body>
</html>
